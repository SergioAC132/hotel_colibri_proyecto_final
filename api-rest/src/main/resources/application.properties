spring.application.name=api-rest

# ---- Base de datos (credenciales por variables de entorno, nunca en el repo) ----
spring.datasource.url=jdbc:mysql://localhost:3306/hotel_colibri?createDatabaseIfNotExist=true&serverTimezone=America/Mexico_City
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# ---- Errores: RFC 9457 ProblemDetail, sin trazas ----
spring.mvc.problemdetails.enabled=true
# (en Spring Boot 4 server.error.* esta obsoleto; su reemplazo es spring.web.error.*)
spring.web.error.include-stacktrace=never
spring.web.error.include-message=never

# ---- Servicios SOAP ----
soap.divisas.url=http://localhost:8001/
soap.pagos.url=http://localhost:8002/
soap.timeout-ms=3000

# ---- OpenAPI / Swagger UI ----
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
